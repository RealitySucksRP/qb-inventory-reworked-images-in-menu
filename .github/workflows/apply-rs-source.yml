name: Apply RS source update
on:
  push:
    branches: [source-update-punk-v3.0.3-final]
    paths: ['.rs-update/READY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-update-punk-v3.0.3-final
          fetch-depth: 0
      - name: Reconstruct verified overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .rs-update/chunk-*.txt | base64 -d > /tmp/rs-overlay.tgz
          echo "4e26051bb64aa5091dccc1e3a980f5c488e9201e14613b5b0376ecc5ecf35459  /tmp/rs-overlay.tgz" | sha256sum -c -
          tar -xzf /tmp/rs-overlay.tgz -C .
      - name: Remove temporary updater
        run: |
          rm -rf .rs-update
          rm -f .github/workflows/apply-rs-source.yml
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "RealitySucksRP"
          git config user.email "williamb1982@live.com"
          git add -A
          git commit -m "Update Punk inventory to v3.0.3" || exit 0
          git push origin HEAD:source-update-punk-v3.0.3-final
