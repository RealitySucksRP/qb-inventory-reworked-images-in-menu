name: Apply Punk v3.0.4 reupload

on:
  push:
    branches:
      - reupload-punk-v3.0.4
    paths:
      - '.github/workflows/apply-reupload-v3.0.4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reupload-punk-v3.0.4
          fetch-depth: 0

      - name: Apply verified source delta
        run: |
          git apply --check .rs-update/reupload-v3.0.4.patch
          git apply .rs-update/reupload-v3.0.4.patch

      - name: Remove temporary transfer files and commit
        run: |
          rm -rf .rs-update
          rm -f .github/workflows/apply-reupload-v3.0.4.yml
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update RS Punk Inventory to v3.0.4"
          git push origin HEAD:reupload-punk-v3.0.4
