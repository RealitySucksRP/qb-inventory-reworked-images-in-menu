name: Apply RS inventory overlay
on:
  push:
    branches: [update-punk-v3.0.3]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ hashFiles('.rs-update/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-punk-v3.0.3
          fetch-depth: 0
      - name: Reconstruct and apply overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .rs-update/part-*.b64 | base64 -d > /tmp/overlay.tgz
          echo "ead59e3ed79f68df3659273735ce338b8461ec139a22334d661a9871e036b7a6  /tmp/overlay.tgz" | sha256sum -c -
          tar -xzf /tmp/overlay.tgz
          rm -rf .rs-update
          rm -f .github/workflows/apply-rs-overlay.yml
          git config user.name "RealitySucksRP Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Punk inventory to v3.0.3 with upstream attribution"
          git push origin HEAD:update-punk-v3.0.3
